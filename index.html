<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Tour - Sincronización</title>
    <!-- Librería estable para conexión en vivo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        /* Diseño moderno estilo Aplicación Web */
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #3b82f6; --danger: #ef4444; --warning: #f59e0b; --success: #10b981; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
        .card { background: var(--card); padding: 30px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); max-width: 400px; width: 100%; }
        h1 { margin-top: 0; font-size: 1.5rem; color: var(--primary); }
        button { border: none; padding: 16px 24px; font-size: 1.1rem; border-radius: 12px; cursor: pointer; font-weight: 600; width: 100%; margin: 10px 0; transition: transform 0.1s; color: white; }
        button:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary); }
        .btn-play { background: var(--success); }
        .btn-pause { background: var(--warning); color: #000; }
        #status { margin: 20px 0; font-size: 1.1rem; padding: 15px; border-radius: 8px; background: rgba(255,255,255,0.05); }
        .indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--danger); margin-right: 8px; transition: background 0.3s;}
        .connected { background: var(--success); }
        #adminPanel { display: none; }
    </style>
</head>
<body>

    <!-- Pantalla del Turista -->
    <div class="card" id="listenerView">
        <h1>Ruta Cultural MVD</h1>
        <p>Conecta tus auriculares y presiona el botón para sincronizar tu teléfono con el guía.</p>
        <button id="enableBtn" class="btn-primary">🎧 Habilitar Audio</button>
        <div id="status">
            <span class="indicator" id="connIndicator"></span>
            <span id="statusText">Esperando conexión...</span>
        </div>
    </div>

    <!-- Pantalla Tuya (Guía) -->
    <div class="card" id="adminPanel">
        <h1>Control del Guía</h1>
        <div id="adminStatus" style="margin-bottom: 20px; font-size: 0.9rem;">
            <span class="indicator" id="adminConnIndicator"></span>
            <span id="adminStatusText">Conectando al sistema...</span>
        </div>
        <button id="playBtn" class="btn-play">▶ DAR PLAY A TODOS</button>
        <button id="pauseBtn" class="btn-pause">⏸ PAUSAR AUDIO</button>
    </div>

    <!-- PEGA AQUÍ TU ENLACE REAL DE CLOUDINARY -->
    <audio id="audioTrack" src="https://res.cloudinary.com/f8l7nucq/video/upload/v1786714208/Primer_recorrido_Origen_vFinalMix_260811_COMPRIMIDO_bkh8il.mp3" preload="auto"></audio>

    <script>
        const audio = document.getElementById('audioTrack');
        const enableBtn = document.getElementById('enableBtn');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const statusText = document.getElementById('statusText');
        const connIndicator = document.getElementById('connIndicator');
        const adminConnIndicator = document.getElementById('adminConnIndicator');
        const adminStatusText = document.getElementById('adminStatusText');

        // Detector de panel (Turista vs Guía)
        const isAdmin = new URLSearchParams(window.location.search).get('admin') === '1';

        if (isAdmin) {
            document.getElementById('listenerView').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
        }

        // Conexión segura con el servidor de mensajería (identificador único para que no falle)
        const clientId = "tour_mvd_" + Math.random().toString(16).slice(2);
        const client = new Paho.MQTT.Client("broker.hivemq.com", Number(8884), clientId);

        // Qué pasa si se pierde la señal en la calle
        client.onConnectionLost = function (responseObject) {
            updateStatus("Desconectado. Reconectando...", false);
            setTimeout(() => location.reload(), 3000); // Intenta refrescar solo
        };

        // Escuchar tus órdenes
        client.onMessageArrived = function (message) {
            if (!isAdmin) {
                if (message.payloadString === "PLAY_AUDIO") {
                    audio.play();
                    statusText.innerText = "▶ ¡Reproduciendo!";
                } else if (message.payloadString === "PAUSE_AUDIO") {
                    audio.pause();
                    statusText.innerText = "⏸ Audio en pausa...";
                }
            }
        };

        // Función para actualizar las luces verde/roja
        function updateStatus(text, isConnected) {
            if (isAdmin) {
                adminStatusText.innerText = text;
                adminConnIndicator.className = isConnected ? "indicator connected" : "indicator";
            } else {
                if (enableBtn.style.display === 'none') statusText.innerText = text;
                connIndicator.className = isConnected ? "indicator connected" : "indicator";
            }
        }

        // Conectar al sistema
        client.connect({
            onSuccess: function () {
                client.subscribe("origen/tour/audio");
                updateStatus(isAdmin ? "Sistema Online. Listo para comandar." : "Esperando la orden del guía...", true);
            },
            onFailure: function (e) {
                updateStatus("Señal débil. Reintentando...", false);
            },
            useSSL: true
        });

        // Habilitar audio para el Turista
        if (!isAdmin) {
            enableBtn.addEventListener('click', () => {
                audio.play().then(() => {
                    audio.pause();
                    audio.currentTime = 0;
                    enableBtn.style.display = 'none';
                    if (client.isConnected()) {
                        statusText.innerText = "✅ ¡Listo! Esperando al guía...";
                    }
                }).catch(e => alert("Error: Toca la pantalla y vuelve a intentar."));
            });
        }

        // Botones de Play y Pausa para ti (Guía)
        function sendCommand(cmd) {
            if (client.isConnected()) {
                let message = new Paho.MQTT.Message(cmd);
                message.destinationName = "origen/tour/audio";
                client.send(message);
            } else {
                alert("Sin conexión. Espera que la luz roja se ponga verde.");
            }
        }

        playBtn.addEventListener('click', () => sendCommand("PLAY_AUDIO"));
        pauseBtn.addEventListener('click', () => sendCommand("PAUSE_AUDIO"));
    </script>
</body>
</html>
